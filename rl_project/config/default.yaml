seed: 42
device: "auto"
ponder_root: "../"

env:
  max_turns: 10
  success_distance_threshold: 1.0

reward:
  task_success: 1.0
  task_failure: -1.0
  safety_violation: -5.0
  safety_correct_friction: 0.1
  per_turn_penalty: -0.05
  successful_disambiguation: 0.2

encoder:
  model_name: "all-MiniLM-L6-v2"
  embedding_dim: 384
  freeze: true

policy:
  hidden_dims: [256, 128]
  activation: "relu"
  dropout: 0.0

ppo:
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  update_epochs: 4
  num_minibatches: 4
  rollout_steps: 2048
  total_timesteps: 500000

training:
  num_envs: 1
  log_interval: 10
  eval_interval: 50
  eval_episodes: 100
  save_interval: 100
  checkpoint_dir: "checkpoints/"

evaluation:
  num_episodes: 500
  user_simulator: "rule_based"
